name: Daily Drop preview checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-feed-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Check live news endpoint
        run: |
          curl --fail --silent --show-error --max-time 45 "https://jqgkmtbflkdvyyoehhzx.supabase.co/functions/v1/live-news?category=Kenya" -o live-news.json
          node -e "const d=require('./live-news.json'); if (!Array.isArray(d.items) || !d.category || !d.fetchedAt) { console.error(d); process.exit(1); } console.log('Live news endpoint OK:', d.category, d.items.length, 'items');"
